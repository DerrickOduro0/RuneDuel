# Copies the live Supabase database every night and keeps each copy for 30 days.
# Needs one repository secret: SUPABASE_DB_URL (Settings > Secrets and variables > Actions).
# To restore a copy, see "Backups" in DEPLOY.md.
name: Nightly database backup

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install the PostgreSQL 17 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Copy the database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Add the SUPABASE_DB_URL secret first."; exit 1; fi
          FILE="runeduel-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --schema=public --format=custom --no-owner --no-privileges --file "$FILE"
          ls -lh "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Keep the copy for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
